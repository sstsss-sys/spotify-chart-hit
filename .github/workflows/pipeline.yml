name: Update Jimin Charts (single trigger)

# PUBLIC repo: this workflow + the resulting JSON data only.
# PRIVATE repo (checked out below as "engine/" via a token): all the
# actual scraping/merge logic, INCLUDING the 13 committed Spotify session
# files (auth-song-americas.json etc) - see SETUP.md. Same public/private
# split as the Shazam tracker; the session files live in the private repo
# instead of as secrets so they're easy to swap without touching GitHub's
# Secrets UI, at the cost of anyone with access to that private repo (or
# a future accidental visibility change) being able to see them - a
# deliberate tradeoff, not an oversight.
#
# Rate-limit design: every (chart type x continent) combination - song,
# album and artist, each across americas/europe/asia/mea - uses its OWN
# Spotify account (12 accounts), PLUS a 13th, fully separate account just
# for "global" so it never shares anything with the other 12. All 13
# scraping jobs run fully in parallel.
#
# No shared "final" job. song/album/artist/global each publish straight
# to final.json the moment THEIR OWN data is ready - none of them wait on
# each other. Each one updates only its own top-level key in final.json
# (see update-final.js) and leaves the other 3 exactly as they were, so
# there's no "everything waits for the slowest chart type" delay, and no
# way for one section's update to corrupt another's rank/stream-change
# numbers - each section's math only ever depends on its own history.
#
# Race safety: since song/album/artist/global CAN finish and try to push
# at close to the same time, each one commits+pushes in a retry loop (see
# the "Publish ..." step in every terminal job below). On a rejected push
# (someone else published in between), only final.json gets re-synced
# from the latest commit before retrying - never that job's own files -
# so a retry can never lose or overwrite this run's own freshly scraped
# data, only redo the final.json merge against the newest version.
#
# Manual trigger only - no schedule. Run it from the Actions tab whenever
# you want a fresh chart.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jimin-chart-pipeline
  cancel-in-progress: false

jobs:
  regional-americas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repo (workflow + data)
        uses: actions/checkout@v4
      - name: Checkout private engine repo
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/spotify-chart-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install engine dependencies
        working-directory: engine
        run: npm install
      - name: Install Playwright browser
        working-directory: engine
        run: npx playwright install --with-deps chromium
      - name: Use committed Spotify session
        run: cp engine/auth-song-americas.json auth.json
      - name: Run regional-americas.js
        run: node engine/regional-americas.js
      - name: Save output (regional-americas-out)
        uses: actions/upload-artifact@v4
        with:
          name: regional-americas-out
          overwrite: true
          path: |
            *.json
            data/**

