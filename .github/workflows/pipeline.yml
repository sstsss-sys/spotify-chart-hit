  global:
    runs-on: ubuntu-latest
    # NOTE: unlike the other 12 scrape jobs (regional/album/artist), this
    # one both scrapes AND publishes to git in the same job - it never got
    # split into a separate "collect" + "merge" job pair. That means it
    # can't use the `container:` Playwright-image shortcut the other jobs
    # use (a job-level `container:` runs every step, including the git
    # commit/push at the bottom, inside that container - and the git
    # commands there failed with "fatal: not in a git directory", so this
    # job is kept on the plain runner with Playwright installed the normal
    # apt way instead). It's still faster than before thanks to the
    # node_modules cache below.
    steps:
      - name: Checkout this repo (workflow + data)
        uses: actions/checkout@v4
      - name: Checkout private engine repo
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/spotify-chart-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
