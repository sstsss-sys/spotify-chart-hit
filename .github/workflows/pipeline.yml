      - name: Publish artist chart (updates final.json's 'artist' section on its own)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          attempt=0
          while true; do
            attempt=$((attempt+1))

            node engine/prepare-artist.js

