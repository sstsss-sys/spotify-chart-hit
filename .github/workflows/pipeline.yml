  regional-merge:
    needs: [regional-americas, regional-europe, regional-asia, regional-mea]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repo (workflow + data)
        uses: actions/checkout@v4
      - name: Checkout private engine repo
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/spotify-chart-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: Download regional-americas-out
        uses: actions/download-artifact@v4
        with:
          name: regional-americas-out
          path: .
      - name: Download regional-europe-out
        uses: actions/download-artifact@v4
        with:
          name: regional-europe-out
          path: .
      - name: Download regional-asia-out
        uses: actions/download-artifact@v4
        with:
          name: regional-asia-out
          path: .
      - name: Download regional-mea-out
        uses: actions/download-artifact@v4
        with:
          name: regional-mea-out
          path: .
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait 3s before merging (lets any last artifact write settle)
        run: sleep 3
      - name: Publish song chart (updates final.json's 'song' section on its own)
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Raw scrape output this job owns. `git reset --hard` below would
          # wipe it, so it is parked outside the repo first.
          SCRAPED="regional-americas.json regional-europe.json regional-asia.json regional-mea.json chart-dates-americas.json chart-dates-europe.json chart-dates-asia.json chart-dates-mea.json"

          # The ONLY paths this job may ever commit. Anything outside this
          # list belongs to a sibling job and must arrive via origin/main.
          OWNED="$SCRAPED regional.json data/song.json data/history/yesterday-daily-song.json data/history/previous-weekly-song.json final.json"

          mkdir -p /tmp/scraped
          for f in $SCRAPED; do
            if [ -f "$f" ]; then cp "$f" /tmp/scraped/; fi
          done

          attempt=0
          while [ "$attempt" -lt 10 ]; do
            attempt=$((attempt + 1))

            # Full sync to main. `--hard`, NOT `--mixed`: `--mixed` leaves the
            # working tree on the old checkout, and `git add -A` then commits
            # every sibling section's stale file back as a silent revert. That
            # is what froze data/*.json on day one and made streamChange
            # measure against day one forever.
            git fetch origin main
            git reset --hard origin/main

            # Put back this job's own scrape output, and nothing else.
            cp -a /tmp/scraped/. .

            # Rebuilt every attempt, on top of the data/ and final.json
            # that main actually has right now.
            node engine/merge-regional.js
            node engine/prepare-song.js
            node engine/update-final.js song


            # Explicit paths instead of `git add -A`, so touching a sibling
            # section is structurally impossible. auth.json can no longer be
            # staged even by accident.
            TO_ADD=""
            for f in $OWNED; do
              if [ -e "$f" ]; then TO_ADD="$TO_ADD $f"; fi
            done
            if [ -z "$TO_ADD" ]; then
              echo "Nothing to stage."
              exit 0
            fi
            git add -- $TO_ADD

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: update song chart"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (attempt $attempt) - another section published in between. Re-syncing and retrying..."
            sleep 3
          done

          echo "Giving up after 10 attempts."
          exit 1

