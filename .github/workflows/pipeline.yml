name: Update Jimin Charts (single trigger)
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jimin-chart-pipeline
  cancel-in-progress: false

jobs:
  regional-americas:
    runs-on: ubuntu-latest
    # Went back to plain apt-based Playwright install on every job (slower
    # per-job than the Docker-image shortcut we tried, but that shortcut
    # made jobs fail outright on a flaky image pull instead of just being
    # slow - since regional-merge needs ALL 4 regions to succeed together,
    # one flaky pull anywhere meant re-running the whole thing. Reliability
    # over speed, per your call.
    steps:
      - name: Checkout this repo (workflow + data)
        uses: actions/checkout@v4
      - name: Checkout private engine repo
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/spotify-chart-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Use prebuilt node_modules (baked into the image, nothing to install)
        working-directory: engine
        run: ln -s /prebuilt/node_modules node_modules
      - name: Use committed Spotify session
        run: cp engine/auth-song-americas.json auth.json
      - name: Run regional-americas.js
        run: node engine/regional-americas.js
      - name: Save output (regional-americas-out)
        uses: actions/upload-artifact@v4
        with:
          name: regional-americas-out
          overwrite: true
          path: |
            regional-americas.json
            chart-dates-americas.json

