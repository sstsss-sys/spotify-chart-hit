name: Update Jimin Charts (single trigger)
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jimin-chart-pipeline
  cancel-in-progress: false

jobs:
  regional-americas:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    steps:
      - name: Checkout this repo (workflow + data)
        uses: actions/checkout@v4
      - name: Checkout private engine repo
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/spotify-chart-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: engine/node_modules
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('engine/package-lock.json') }}
      - name: Install engine dependencies
        working-directory: engine
        run: npm install
      - name: Use committed Spotify session
        run: cp engine/auth-song-americas.json auth.json
      - name: Wait 3s before scraping (saves date + chart per region)
        run: sleep 3
      - name: Run regional-americas.js
        run: node engine/regional-americas.js
      - name: Save output (regional-americas-out)
        uses: actions/upload-artifact@v4
        with:
          name: regional-americas-out
          overwrite: true
          path: |
            regional-americas.json
            chart-dates-americas.json

