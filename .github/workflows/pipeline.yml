          name: artist-mea-out
          path: .
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait 3s before merging (lets any last artifact write settle)
        run: sleep 3
      - name: Publish artist chart (updates final.json's 'artist' section on its own)
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Raw scrape output this job owns. `git reset --hard` below would
          # wipe it, so it is parked outside the repo first.
          SCRAPED="artist-americas.json artist-europe.json artist-asia.json artist-mea.json chart-artist-americas.json chart-artist-europe.json chart-artist-asia.json chart-artist-mea.json"

          # The ONLY paths this job may ever commit. Anything outside this
          # list belongs to a sibling job and must arrive via origin/main.
          OWNED="$SCRAPED artist.json data/artist.json data/history/yesterday-daily-artist.json data/history/previous-weekly-artist.json final.json"

          mkdir -p /tmp/scraped
          for f in $SCRAPED; do
            if [ -f "$f" ]; then cp "$f" /tmp/scraped/; fi
          done

          attempt=0
          while [ "$attempt" -lt 10 ]; do
            attempt=$((attempt + 1))

            # Full sync to main. `--hard`, NOT `--mixed`: `--mixed` leaves the
            # working tree on the old checkout, and `git add -A` then commits
            # every sibling section's stale file back as a silent revert. That
            # is what froze data/*.json on day one and made streamChange
            # measure against day one forever.
            git fetch origin main
            git reset --hard origin/main

            # Put back this job's own scrape output, and nothing else.
            cp -a /tmp/scraped/. .

            # Rebuilt every attempt, on top of the data/ and final.json
            # that main actually has right now.
            node engine/merge-artist.js
            node engine/prepare-artist.js
            node engine/update-final.js artist


            # Explicit paths instead of `git add -A`, so touching a sibling
            # section is structurally impossible. auth.json can no longer be
            # staged even by accident.
            TO_ADD=""
            for f in $OWNED; do
              if [ -e "$f" ]; then TO_ADD="$TO_ADD $f"; fi
            done
            if [ -z "$TO_ADD" ]; then
              echo "Nothing to stage."
              exit 0
            fi
            git add -- $TO_ADD

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: update artist chart"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (attempt $attempt) - another section published in between. Re-syncing and retrying..."
            sleep 3
          done

          echo "Giving up after 10 attempts."
          exit 1

  global:
    runs-on: ubuntu-latest
    # This job both scrapes AND publishes to git in the same job - it
    # can't use the `container:` Playwright-image shortcut the other jobs
    # use (a job-level `container:` runs every step, including the git
    # commit/push at the bottom, inside that container - and the git
    # commands there failed with "fatal: not in a git directory"), so
    # it's kept on the plain runner with Playwright installed the normal
    # apt way instead.
    timeout-minutes: 30
    steps:
      - name: Checkout this repo (workflow + data)
        uses: actions/checkout@v4
      - name: Checkout private engine repo
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/spotify-chart-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: engine/node_modules
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('engine/package-lock.json') }}
      - name: Install engine dependencies
        working-directory: engine
        run: npm install
      - name: Install Playwright browser
        working-directory: engine
        run: npx playwright install --with-deps chromium
      - name: Use committed Spotify session
        run: cp engine/auth-global.json auth.json
      - name: Wait 3s before scraping (saves date + chart per region)
        run: sleep 3
      - name: Run global.js
        run: node engine/global.js
      - name: Publish global chart (updates final.json's 'global' section on its own)
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Raw scrape output this job owns. `git reset --hard` below would
          # wipe it, so it is parked outside the repo first.
          SCRAPED="global-chart.json global-chart-dates.json"

          # The ONLY paths this job may ever commit. Anything outside this
          # list belongs to a sibling job and must arrive via origin/main.
          OWNED="$SCRAPED data/global.json data/history/yesterday-daily-global.json data/history/previous-weekly-global.json final.json"

          mkdir -p /tmp/scraped
          for f in $SCRAPED; do
            if [ -f "$f" ]; then cp "$f" /tmp/scraped/; fi
          done

          attempt=0
          while [ "$attempt" -lt 10 ]; do
            attempt=$((attempt + 1))

            # Full sync to main. `--hard`, NOT `--mixed`: `--mixed` leaves the
            # working tree on the old checkout, and `git add -A` then commits
            # every sibling section's stale file back as a silent revert. That
            # is what froze data/*.json on day one and made streamChange
            # measure against day one forever.
            git fetch origin main
            git reset --hard origin/main

            # Put back this job's own scrape output, and nothing else.
            cp -a /tmp/scraped/. .

            # global.js already ran once above and must NOT run again in
            # here - a retry would re-hit Spotify's API for nothing. Its
            # output is restored from /tmp/scraped instead.
            node engine/prepare-global.js
            node engine/update-final.js global


            # Explicit paths instead of `git add -A`, so touching a sibling
            # section is structurally impossible. auth.json can no longer be
            # staged even by accident.
            TO_ADD=""
            for f in $OWNED; do
              if [ -e "$f" ]; then TO_ADD="$TO_ADD $f"; fi
            done
            if [ -z "$TO_ADD" ]; then
              echo "Nothing to stage."
              exit 0
            fi
            git add -- $TO_ADD

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: update global chart"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (attempt $attempt) - another section published in between. Re-syncing and retrying..."
            sleep 3
          done

          echo "Giving up after 10 attempts."
          exit 1
