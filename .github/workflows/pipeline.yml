        uses: actions/checkout@v4
      - name: Checkout private engine repo
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/spotify-chart-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: engine
      - name: Download regional-americas-out
        uses: actions/download-artifact@v4
        with:
          name: regional-americas-out
          path: .
      - name: Download regional-europe-out
        uses: actions/download-artifact@v4
        with:
          name: regional-europe-out
          path: .
      - name: Download regional-asia-out
        uses: actions/download-artifact@v4
        with:
          name: regional-asia-out
          path: .
      - name: Download regional-mea-out
        uses: actions/download-artifact@v4
        with:
          name: regional-mea-out
          path: .
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run merge-regional.js
        run: node engine/merge-regional.js
      - name: Publish song chart (updates final.json's 'song' section on its own)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Random pause before the FIRST push attempt too (not just on
          # retry after a conflict) - song/artist/album/global publish in
          # parallel and, if they all reach "git push" at the exact same
          # moment, they collide before the retry logic even gets a
          # chance to help. A random 0-5s jitter here spreads out the 4
          # jobs' first attempts so they're less likely to land together.
          sleep $((RANDOM % 6))

          attempt=0
          while true; do
            attempt=$((attempt+1))

            node engine/prepare-song.js
            node engine/update-final.js song

            sleep 0.5
            git add -A -- ':!auth.json' ':!node_modules' ':!engine'

            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi

            git commit -m "chore: update song chart"

            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi

            echo "Push rejected (attempt $attempt) - another section published in between. Re-syncing and retrying..."
            git reset --soft HEAD~1
            git fetch origin main
            git reset --mixed origin/main
            git checkout HEAD -- final.json 2>/dev/null || true
            sleep 3

            if [ "$attempt" -ge 10 ]; then
              echo "Giving up after 10 attempts."
              exit 1
            fi
          done

